name: Bug Report
description: Report incorrect or unexpected behavior.
title: "[Bug]: "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that cause the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe the actual result.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project version
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Specify the macOS, Alfred, and CleanShot X versions.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove credentials and sensitive information.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional information

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched for existing reports of this problem.
          required: true
