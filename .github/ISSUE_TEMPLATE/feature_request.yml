name: Feature Request
description: Propose a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other solutions you considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional information

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I searched for existing requests for this feature.
          required: true
